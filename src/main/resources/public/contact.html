<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Mothale Holdings in Springs, Gauteng.">
    <title>Contact Us | Mothale Holdings</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script src="js/layout.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/contact.js" defer></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
    <!-- Page heading -->
    <section class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Questions about renting a scooter? We're happy to help.</p>
        </div>
    </section>

    <section class="section">
        <div class="container two-col">

            <!-- Details and social links (filled in by contact.js from config.js) -->
            <div>
                <h2>Our details</h2>
                <ul class="contact-details" id="contact-details"></ul>

                <h2>Follow us</h2>
                <ul class="social-links" id="social-links"></ul>
            </div>

            <!-- Map -->
            <div>
                <h2>Find us</h2>
                <iframe class="map-frame" title="Map showing the Mothale Holdings address" loading="lazy"
                        src="https://maps.google.com/maps?q=1%20Bokmakierie%20Road%2C%20Daggafontein%2C%20Springs&output=embed"></iframe>
            </div>

        </div>
    </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
